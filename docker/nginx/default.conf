# Local / behind-a-TLS-load-balancer configuration.
# For TLS termination in nginx itself, use production.conf instead.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream betx_api { server api:4000; keepalive 32; }

# Shared security headers (also set in production.conf)
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ── Customer web app ───────────────────────────────────────────────────
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html/web;
  client_max_body_size 200k;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'" always;

  location /api/ { proxy_pass http://betx_api; include /etc/nginx/conf.d/proxy_params.inc; }
  location = /health { proxy_pass http://betx_api; }
  location /ws {
    proxy_pass http://betx_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

# ── Admin console (expose only on a private network / VPN / IP allow-list) ──
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html/admin;
  add_header X-Frame-Options DENY always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # allow 10.0.0.0/8; deny all;   # ← restrict in production

  location /api/ { proxy_pass http://betx_api; include /etc/nginx/conf.d/proxy_params.inc; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
